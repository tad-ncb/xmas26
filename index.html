<script>
(function(){
var ITER=600000;
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.error('sw',e)})})}
var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
var hex=function(u){return Array.prototype.map.call(u,function(b){return b.toString(16).padStart(2,'0')}).join('')};
var BLOB=b64(document.getElementById('blob').textContent.trim());
var salt=BLOB.slice(0,16),iv=BLOB.slice(16,32),tag=BLOB.slice(32,64),ct=BLOB.slice(64);
var KEY='xmas26:'+hex(salt.slice(0,6));
async function open(km){
  var ak=await crypto.subtle.importKey('raw',km.slice(0,32),'AES-CBC',false,['decrypt']);
  var mk=await crypto.subtle.importKey('raw',km.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  var data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  if(!(await crypto.subtle.verify('HMAC',mk,tag,data)))throw new Error('bad key');
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ak,ct));
}
async function derive(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim()),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},k,512));
}
function show(html){document.open();document.write(html);document.close()}
var gate=document.getElementById('gate'),err=document.getElementById('err'),go=document.getElementById('go');
if(!window.crypto||!crypto.subtle){gate.hidden=false;err.textContent='This browser blocks encryption on this address (needs https).';return}
(async function(){
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{show(await open(b64(saved)));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
  gate.hidden=false;
  document.getElementById('f').addEventListener('submit',async function(ev){
    ev.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
    try{
      var km=await derive(document.getElementById('pw').value);
      var html=await open(km);
      if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,btoa(String.fromCharCode.apply(null,km)))}catch(e){}}
      show(html);
    }catch(e){err.textContent='Wrong passphrase — try again';go.disabled=false;go.textContent='Unlock'}
  });
})();
})();
</script></body></html>
